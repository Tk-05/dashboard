- name: Home
  # Optionally, if you only have a single page you can hide the desktop navigation for a cleaner look
  hide-desktop-navigation: true

  columns:
    - size: small
      widgets:
        - type: calendar
          first-day-of-week: monday
        - type: clock
          hour-format: 24h
        - type: weather
          location: Winsen, Germany
          units: metric # alternatively "imperial"
          hour-format: 24h # alternatively "24h"
          # Optionally hide the location from being displayed in the widget
          # hide-location: true

    - size: full
      widgets:
        - type: monitor
          cache: 1m
          title: Services
          sites:
            - title: Jellyfin
              url: https://jellyfin.tk05.org
              icon: /assets/jellyfin-logo.png
            - title: Immich
              url: https://immich.internal.tk05.org
              icon: /assets/immich-logo.png
            - title: TrueNas
              url: https://truenas.internal.tk05.org/ui/dashboard
              icon: /assets/truenas-logo.png
            - title: Pihole
              url: https://pihole.internal.tk05.org/admin
              icon: /assets/pihole-logo.png
            - title: Proxmox
              url: https://proxmox.internal.tk05.org/#v1:0:18:4
              icon: /assets/proxmox-logo.png
            - title: Nginx
              url: https://nginx-vps.internal.tk05.org/
              icon: /assets/nginx-logo.png
            - title: Tailscale
              url: https://login.tailscale.com/admin/machines
              icon: /assets/tailscale-logo.png
            - title: Strato
              url: https://www.strato.de/apps/CustomerService#/skl
              icon: /assets/strato-logo.png
            - title: Nextcloud
              url: https://nextcloud.tk05.org
              icon: /assets/nextcloud-logo.png
            - title: Crafty
              url: https://crafty.internal.tk05.org/login?next=%2Fpanel%2Fdashboard
            - title: Aniworld downloader
              url: https://aniworld.internal.tk05.org/
            - title: jellyseer
              url: http://100.127.101.14:30357/
            - title: Portainer
              url: https://portainer.internal.tk05.org
            - title: WOL
              url: http://100.92.161.2:9090
            - title: Crowdsec
              url: https://crowdsec.internal.tk05.org/
            - title: Hetzner
              url: https://console.hetzner.com/projects

        - type: group
          widgets:
            - type: reddit
              subreddit: homelab
              show-thumbnails: true
            - type: reddit
              subreddit: selfhosted
              show-thumbnails: true
            - type: reddit
              subreddit: pcmasterrace
              show-thumbnails: true
